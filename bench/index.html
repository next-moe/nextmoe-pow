<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nextmoe-pow bench</title>
    <script type="importmap">
      { "imports": { "@nextmoe/pow-solver": "/packages/solver/dist/index.js" } }
    </script>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #60a5fa; } }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: right; white-space: nowrap; }
      th:first-child, td:first-child { text-align: left; }
      .scroll { overflow-x: auto; }
      .muted { color: var(--muted); }
      button { font: inherit; padding: 6px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 6px; }
      button:disabled { opacity: 0.5; }
      input { font: inherit; width: 8em; }
      pre { white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>nextmoe-pow bench</h1>
      <p class="muted" id="device"></p>
      <p>
        <label>Label <input id="label" placeholder="device tier" /></label>
        <label>Samples <input id="samples" type="number" value="20" min="1" /></label>
        <label>Target ms <input id="target" type="number" value="1500" min="100" /></label>
        <label><input id="simd" type="checkbox" style="width:auto" /> SIMD build</label>
      </p>
      <p><button id="run">Run benchmark</button> <span id="status" class="muted"></span></p>
      <h2>Throughput</h2>
      <div class="scroll"><table id="rates"></table></div>
      <h2>Solves</h2>
      <div class="scroll"><table id="solves"></table></div>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./dist/bench.js"></script>
  </body>
</html>
